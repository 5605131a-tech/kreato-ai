<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="t d" font-family="Lato, 'Segoe UI', system-ui, sans-serif">
<title id="t">Schemat: kogo pomija bot do powrotu klientów i co robi z odpowiedziami</title>
<desc id="d">Kontakt z listy dostaje SMS tylko wtedy, gdy nie odpisał STOP, nie dostał wiadomości w ostatnich 31 dniach i mieści się w limicie i godzinach pracy. Odpowiedź STOP wypisuje numer na stałe, a inne odpowiedzi trafiają do właściciela na Telegram.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker>
</defs>
<rect width="960" height="520" rx="18" fill="#0c1221"/>
<text x="40" y="52" font-size="26" font-weight="900" fill="#f1f5f9">Kogo bot pomija i co robi z odpowiedziami</text>
<text x="40" y="78" font-size="15" fill="#94a3b8">Reguły działają automatycznie. Zgody klientów potwierdzasz Ty przed startem.</text>
<rect x="330" y="105" width="300" height="100" rx="14" fill="#131c2f" stroke="#8b5cf6" stroke-opacity=".5"/>
<text x="350" y="136" font-size="17" font-weight="800" fill="#f1f5f9">Kontakt z listy</text>
<text x="350" y="162" font-size="15" fill="#cbd5e1">imię, telefon, segment</text>
<text x="350" y="184" font-size="15" fill="#cbd5e1">ostatnia wizyta (próg dni)</text>
<text x="350" y="206" font-size="14" fill="#94a3b8">zgody: potwierdzasz Ty</text>
<rect x="40" y="250" width="400" height="112" rx="14" fill="#131c2f" stroke="#10b981" stroke-opacity=".7"/>
<text x="60" y="281" font-size="17" font-weight="800" fill="#f1f5f9">Dostanie SMS, gdy</text>
<text x="60" y="307" font-size="15" fill="#cbd5e1">nie odpisał wcześniej STOP</text>
<text x="60" y="329" font-size="15" fill="#cbd5e1">w ciągu 31 dni nie dostał od nas SMS</text>
<text x="60" y="351" font-size="14" fill="#94a3b8">mieści się w limicie 200 i w godzinach</text>
<rect x="520" y="250" width="400" height="112" rx="14" fill="#131c2f" stroke="#64748b" stroke-opacity=".7"/>
<text x="540" y="281" font-size="17" font-weight="800" fill="#f1f5f9">Zostanie pominięty, gdy</text>
<text x="540" y="307" font-size="15" fill="#cbd5e1">odpisał STOP (na stałe)</text>
<text x="540" y="329" font-size="15" fill="#cbd5e1">dostał SMS w ostatnich 31 dniach</text>
<text x="540" y="351" font-size="14" fill="#94a3b8">limit wyczerpany albo tekst za długi</text>
<rect x="40" y="395" width="400" height="100" rx="14" fill="#131c2f" stroke="#8b5cf6" stroke-opacity=".5"/>
<text x="60" y="426" font-size="17" font-weight="800" fill="#f1f5f9">Odpowiedź „STOP”</text>
<text x="60" y="452" font-size="15" fill="#cbd5e1">numer wypisany od razu, na stałe</text>
<text x="60" y="474" font-size="15" fill="#cbd5e1">klient dostaje krótkie potwierdzenie</text>
<text x="60" y="496" font-size="14" fill="#94a3b8">wypada ze wszystkich kampanii</text>
<rect x="520" y="395" width="400" height="100" rx="14" fill="#131c2f" stroke="#8b5cf6" stroke-opacity=".5"/>
<text x="540" y="426" font-size="17" font-weight="800" fill="#f1f5f9">Inna odpowiedź</text>
<text x="540" y="452" font-size="15" fill="#cbd5e1">np. „TAK, poproszę termin”</text>
<text x="540" y="474" font-size="15" fill="#cbd5e1">trafia na Twój Telegram z numerem</text>
<text x="540" y="496" font-size="14" fill="#94a3b8">oddzwaniasz albo umawiasz sam</text>
<line x1="430" y1="207" x2="250" y2="246" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="530" y1="207" x2="710" y2="246" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="240" y1="364" x2="240" y2="391" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="442" y1="340" x2="516" y2="430" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#a)"/>
</svg>
