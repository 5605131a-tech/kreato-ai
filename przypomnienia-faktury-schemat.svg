<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-labelledby="t d" font-family="Lato, 'Segoe UI', system-ui, sans-serif">
<title id="t">Schemat: jak działa bot przypomnień o płatnościach</title>
<desc id="d">Przesyłasz listę faktur, bot układa drabinkę przypomnień od 3 dni przed terminem do 14 dni po terminie, pierwsze wiadomości zatwierdzasz Ty, SMS-y wychodzą w dni robocze, klient może odpisać STOP lub że zapłacił, a wieczorem dostajesz raport na Telegram.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker>
</defs>
<rect width="960" height="580" rx="18" fill="#0c1221"/>
<text x="40" y="52" font-size="26" font-weight="900" fill="#f1f5f9">Jak działa bot przypomnień o płatnościach</text>
<text x="40" y="78" font-size="15" fill="#94a3b8">Od listy faktur do SMS-a i raportu na Telegramie. Ostatnie słowo zawsze masz Ty.</text>
<rect x="40" y="105" width="250" height="118" rx="14" fill="#131c2f" stroke="#8b5cf6" stroke-opacity=".5"/>
<text x="60" y="136" font-size="17" font-weight="800" fill="#f1f5f9">1. Lista faktur</text>
<text x="60" y="162" font-size="15" fill="#cbd5e1">numer, kwota, termin,</text>
<text x="60" y="184" font-size="15" fill="#cbd5e1">telefon klienta</text>
<text x="60" y="206" font-size="14" fill="#94a3b8">plik lub API</text>
<rect x="355" y="105" width="250" height="118" rx="14" fill="#131c2f" stroke="#8b5cf6" stroke-opacity=".5"/>
<text x="375" y="136" font-size="17" font-weight="800" fill="#f1f5f9">2. Drabinka przypomnień</text>
<text x="375" y="162" font-size="15" fill="#cbd5e1">-3, 0, +3, +7, +14 dni</text>
<text x="375" y="184" font-size="15" fill="#cbd5e1">licząc od terminu płatności</text>
<text x="375" y="206" font-size="14" fill="#94a3b8">ton od uprzejmego do stanowczego</text>
<rect x="670" y="105" width="250" height="118" rx="14" fill="#131c2f" stroke="#8b5cf6" stroke-opacity=".5"/>
<text x="690" y="136" font-size="17" font-weight="800" fill="#f1f5f9">3. Twoja akceptacja</text>
<text x="690" y="162" font-size="15" fill="#cbd5e1">pierwsze SMS-y zatwierdzasz</text>
<text x="690" y="184" font-size="15" fill="#cbd5e1">potem możesz włączyć</text>
<text x="690" y="206" font-size="14" fill="#94a3b8">wysyłkę automatyczną</text>
<rect x="670" y="275" width="250" height="118" rx="14" fill="#131c2f" stroke="#10b981" stroke-opacity=".7"/>
<text x="690" y="306" font-size="17" font-weight="800" fill="#f1f5f9">4. SMS do klienta</text>
<text x="690" y="332" font-size="15" fill="#cbd5e1">pn-pt, 9:00-18:00</text>
<text x="690" y="354" font-size="15" fill="#cbd5e1">1 SMS na numer / 2 dni</text>
<text x="690" y="376" font-size="14" fill="#94a3b8">w treści: odpisz STOP</text>
<rect x="355" y="275" width="250" height="118" rx="14" fill="#131c2f" stroke="#64748b" stroke-opacity=".7"/>
<text x="375" y="306" font-size="17" font-weight="800" fill="#f1f5f9">5. Odpowiedź klienta</text>
<text x="375" y="332" font-size="15" fill="#cbd5e1">STOP: koniec przypomnień</text>
<text x="375" y="354" font-size="15" fill="#cbd5e1">„zapłaciłem”: pauza + alert</text>
<text x="375" y="376" font-size="14" fill="#94a3b8">brak: kolejny krok drabinki</text>
<rect x="40" y="275" width="250" height="118" rx="14" fill="#131c2f" stroke="#10b981" stroke-opacity=".7"/>
<text x="60" y="306" font-size="17" font-weight="800" fill="#f1f5f9">6. Raport na Telegram</text>
<text x="60" y="332" font-size="15" fill="#cbd5e1">wieczorem: wysłane SMS-y,</text>
<text x="60" y="354" font-size="15" fill="#cbd5e1">faktury po terminie</text>
<text x="60" y="376" font-size="14" fill="#94a3b8">i ich łączna kwota</text>
<line x1="292" y1="164" x2="351" y2="164" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="607" y1="164" x2="666" y2="164" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="795" y1="225" x2="795" y2="271" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="666" y1="334" x2="609" y2="334" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="351" y1="334" x2="294" y2="334" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="40" y="430" width="880" height="120" rx="14" fill="#131c2f" stroke="#64748b" stroke-opacity=".7"/>
<text x="60" y="462" font-size="17" font-weight="800" fill="#f1f5f9">Czego bot nie robi (pilotaż)</text>
<text x="60" y="490" font-size="14.5" fill="#cbd5e1">Nie windykuje, nie grozi i nie nalicza odsetek. Faktury mocno przeterminowane zostają dla Ciebie.</text>
<text x="60" y="512" font-size="14.5" fill="#cbd5e1">Nie ocenia, czy klient zapłacił: fakturę oznaczasz Ty albo import statusu z Twojego programu.</text>
<text x="60" y="534" font-size="14.5" fill="#cbd5e1">Na razie tylko SMS; dane trafiają do bota z pliku lub przez API.</text>
</svg>
