<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-labelledby="t d" font-family="Lato, 'Segoe UI', system-ui, sans-serif">
<title id="t">Schemat: jak działa bot dla sklepu internetowego</title>
<desc id="d">Klient pyta o paczkę na czacie sklepu, bot prosi o numer zamówienia i e-mail lub telefon, sprawdza zamówienie w systemie sklepu i odpowiada statusem. Przy zwrocie sprawdza termin 14 dni, wysyła zgłoszenie do sklepu w Telegramie, a decyzję podejmuje sklep.</desc>
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#3b82f6"/></linearGradient>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker>
</defs>
<rect width="960" height="580" rx="18" fill="#0c1221"/>
<text x="40" y="52" font-size="26" font-weight="900" fill="#f1f5f9">Jak działa bot dla sklepu</text>
<text x="40" y="78" font-size="15" fill="#94a3b8">Status zamówienia i zwroty, krok po kroku. Decyzje zostają po stronie sklepu.</text>

<!-- row 1 -->
<rect x="40" y="105" width="250" height="118" rx="14" fill="#131c2f" stroke="#8b5cf6" stroke-opacity=".5"/>
<text x="60" y="136" font-size="17" font-weight="800" fill="#f1f5f9">1. Klient pyta</text>
<text x="60" y="162" font-size="15" fill="#cbd5e1">„Gdzie jest moja paczka?”</text>
<text x="60" y="186" font-size="14" fill="#94a3b8">czat na stronie sklepu,</text>
<text x="60" y="206" font-size="14" fill="#94a3b8">także w nocy i w weekend</text>

<rect x="355" y="105" width="250" height="118" rx="14" fill="#131c2f" stroke="#8b5cf6" stroke-opacity=".5"/>
<text x="375" y="136" font-size="17" font-weight="800" fill="#f1f5f9">2. Bot prosi o dane</text>
<text x="375" y="162" font-size="15" fill="#cbd5e1">numer zamówienia</text>
<text x="375" y="186" font-size="15" fill="#cbd5e1">+ e-mail lub telefon</text>
<text x="375" y="206" font-size="14" fill="#94a3b8">z tego zamówienia</text>

<rect x="670" y="105" width="250" height="118" rx="14" fill="#131c2f" stroke="#8b5cf6" stroke-opacity=".5"/>
<text x="690" y="136" font-size="17" font-weight="800" fill="#f1f5f9">3. Sprawdza w sklepie</text>
<text x="690" y="162" font-size="15" fill="#cbd5e1">porównuje dane z zamówieniem</text>
<text x="690" y="186" font-size="14" fill="#94a3b8">WooCommerce, klucz API</text>
<text x="690" y="206" font-size="14" fill="#94a3b8">tylko do odczytu</text>

<line x1="292" y1="164" x2="351" y2="164" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="607" y1="164" x2="666" y2="164" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#a)"/>

<!-- row 2 -->
<line x1="795" y1="225" x2="795" y2="271" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="670" y="275" width="250" height="118" rx="14" fill="#131c2f" stroke="#10b981" stroke-opacity=".7"/>
<text x="690" y="306" font-size="17" font-weight="800" fill="#f1f5f9">4. Odpowiedź z systemu</text>
<text x="690" y="332" font-size="15" fill="#cbd5e1">status, pozycje, przewoźnik,</text>
<text x="690" y="354" font-size="15" fill="#cbd5e1">numer przesyłki</text>
<rect x="690" y="364" width="118" height="22" rx="11" fill="#10b981" fill-opacity=".18" stroke="#10b981"/>
<text x="749" y="380" font-size="12" font-weight="800" fill="#10b981" text-anchor="middle">START i PRO</text>

<rect x="355" y="275" width="250" height="118" rx="14" fill="#131c2f" stroke="#64748b" stroke-opacity=".7"/>
<text x="375" y="306" font-size="17" font-weight="800" fill="#f1f5f9">Dane się nie zgadzają?</text>
<text x="375" y="332" font-size="15" fill="#cbd5e1">odpowiedź jak przy braku</text>
<text x="375" y="354" font-size="15" fill="#cbd5e1">zamówienia, bez podpowiedzi,</text>
<text x="375" y="376" font-size="15" fill="#cbd5e1">co było błędne</text>
<line x1="668" y1="222" x2="610" y2="272" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/>

<!-- row 3 -->
<text x="40" y="432" font-size="16" font-weight="800" fill="#f59e0b">Zwroty i anulowanie</text>
<rect x="208" y="417" width="48" height="22" rx="11" fill="#f59e0b" fill-opacity=".18" stroke="#f59e0b"/>
<text x="232" y="433" font-size="12" font-weight="800" fill="#f59e0b" text-anchor="middle">PRO</text>
<rect x="40" y="448" width="250" height="108" rx="14" fill="#131c2f" stroke="#f59e0b" stroke-opacity=".6"/>
<text x="60" y="478" font-size="17" font-weight="800" fill="#f1f5f9">5. Klient chce zwrot</text>
<text x="60" y="504" font-size="15" fill="#cbd5e1">bot sprawdza, czy mieści się</text>
<text x="60" y="526" font-size="15" fill="#cbd5e1">w 14 dniach od dostawy</text>

<rect x="355" y="448" width="250" height="108" rx="14" fill="#131c2f" stroke="#f59e0b" stroke-opacity=".6"/>
<text x="375" y="478" font-size="17" font-weight="800" fill="#f1f5f9">6. Zgłoszenie do sklepu</text>
<text x="375" y="504" font-size="15" fill="#cbd5e1">powiadomienie w Telegramie,</text>
<text x="375" y="526" font-size="15" fill="#cbd5e1">kontakt klienta zamaskowany</text>

<rect x="670" y="448" width="250" height="108" rx="14" fill="url(#g)" fill-opacity=".18" stroke="#8b5cf6"/>
<text x="690" y="478" font-size="17" font-weight="800" fill="#f1f5f9">7. Sklep decyduje</text>
<text x="690" y="504" font-size="15" fill="#cbd5e1">zwrot pieniędzy, instrukcja</text>
<text x="690" y="526" font-size="15" fill="#cbd5e1">wysyłki, wymiana. Bot nic nie</text>
<text x="690" y="545" font-size="15" fill="#cbd5e1">obiecuje</text>
<line x1="292" y1="502" x2="351" y2="502" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="607" y1="502" x2="666" y2="502" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#a)"/>
</svg>
