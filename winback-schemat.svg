<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-labelledby="t d" font-family="Lato, 'Segoe UI', system-ui, sans-serif">
<title id="t">Schemat: jak działa bot do powrotu uśpionych klientów</title>
<desc id="d">Przesyłasz listę klientów ze zgodami, bot układa kampanię z podglądem, Ty ją zatwierdzasz, SMS-y wychodzą w dni robocze małymi paczkami, odpowiedź STOP wypisuje numer, a inne odpowiedzi trafiają do Ciebie na Telegram wraz z podsumowaniem kampanii.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker>
</defs>
<rect width="960" height="580" rx="18" fill="#0c1221"/>
<text x="40" y="52" font-size="26" font-weight="900" fill="#f1f5f9">Jak działa powrót uśpionych klientów</text>
<text x="40" y="78" font-size="15" fill="#94a3b8">Od listy do odpowiedzi. Nic nie wychodzi bez Twojej akceptacji, a STOP działa od razu.</text>
<rect x="40" y="105" width="250" height="118" rx="14" fill="#131c2f" stroke="#8b5cf6" stroke-opacity=".5"/>
<text x="60" y="136" font-size="17" font-weight="800" fill="#f1f5f9">1. Lista klientów</text>
<text x="60" y="162" font-size="15" fill="#cbd5e1">imię, telefon, data wizyty</text>
<text x="60" y="184" font-size="15" fill="#cbd5e1">segment, np. stali</text>
<text x="60" y="206" font-size="14" fill="#94a3b8">zgody potwierdzasz Ty</text>
<rect x="355" y="105" width="250" height="118" rx="14" fill="#131c2f" stroke="#8b5cf6" stroke-opacity=".5"/>
<text x="375" y="136" font-size="17" font-weight="800" fill="#f1f5f9">2. Podgląd kampanii</text>
<text x="375" y="162" font-size="15" fill="#cbd5e1">ilu odbiorców + przykład SMS</text>
<text x="375" y="184" font-size="15" fill="#cbd5e1">pomijamy: STOP, SMS &lt;31 dni</text>
<text x="375" y="206" font-size="14" fill="#94a3b8">widzisz, zanim cokolwiek wyjdzie</text>
<rect x="670" y="105" width="250" height="118" rx="14" fill="#131c2f" stroke="#10b981" stroke-opacity=".7"/>
<text x="690" y="136" font-size="17" font-weight="800" fill="#f1f5f9">3. Twoja akceptacja</text>
<text x="690" y="162" font-size="15" fill="#cbd5e1">bez „tak” nic nie wychodzi</text>
<text x="690" y="184" font-size="15" fill="#cbd5e1">możesz anulować kampanię</text>
<text x="690" y="206" font-size="14" fill="#94a3b8">pilotaż: krótka lista na start</text>
<rect x="670" y="275" width="250" height="118" rx="14" fill="#131c2f" stroke="#8b5cf6" stroke-opacity=".5"/>
<text x="690" y="306" font-size="17" font-weight="800" fill="#f1f5f9">4. SMS-y wychodzą</text>
<text x="690" y="332" font-size="15" fill="#cbd5e1">dni robocze, 10:00-18:00</text>
<text x="690" y="354" font-size="15" fill="#cbd5e1">po 10 co 10 minut</text>
<text x="690" y="376" font-size="14" fill="#94a3b8">limit 200 SMS / miesiąc</text>
<rect x="355" y="275" width="250" height="118" rx="14" fill="#131c2f" stroke="#64748b" stroke-opacity=".7"/>
<text x="375" y="306" font-size="17" font-weight="800" fill="#f1f5f9">5. Odpowiedzi klientów</text>
<text x="375" y="332" font-size="15" fill="#cbd5e1">STOP: wypis na stałe</text>
<text x="375" y="354" font-size="15" fill="#cbd5e1">inna odpowiedź: do Ciebie</text>
<text x="375" y="376" font-size="14" fill="#94a3b8">bez linków w SMS-ie</text>
<rect x="40" y="275" width="250" height="118" rx="14" fill="#131c2f" stroke="#10b981" stroke-opacity=".7"/>
<text x="60" y="306" font-size="17" font-weight="800" fill="#f1f5f9">6. Ty: Telegram</text>
<text x="60" y="332" font-size="15" fill="#cbd5e1">alert: „TAK” + numer klienta</text>
<text x="60" y="354" font-size="15" fill="#cbd5e1">na koniec: wysłane, błędy</text>
<text x="60" y="376" font-size="14" fill="#94a3b8">oddzwaniasz sam</text>
<line x1="292" y1="164" x2="351" y2="164" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="607" y1="164" x2="666" y2="164" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="795" y1="225" x2="795" y2="271" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="666" y1="334" x2="609" y2="334" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="351" y1="334" x2="294" y2="334" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="40" y="430" width="880" height="120" rx="14" fill="#131c2f" stroke="#64748b" stroke-opacity=".7"/>
<text x="60" y="462" font-size="17" font-weight="800" fill="#f1f5f9">Czego bot nie robi (pilotaż)</text>
<text x="60" y="490" font-size="14.5" fill="#cbd5e1">Nie sprawdza zgód klientów, nie prowadzi rozmowy i nie umawia wizyt przez SMS: to robisz Ty.</text>
<text x="60" y="512" font-size="14.5" fill="#cbd5e1">Nie wysyła linków ani wiadomości do numerów, które odpisały STOP.</text>
<text x="60" y="534" font-size="14.5" fill="#cbd5e1">Nie obiecuje wyniku: skuteczność mierzysz po pierwszej kampanii.</text>
</svg>
