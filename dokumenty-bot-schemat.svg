<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-labelledby="t d" font-family="Lato, 'Segoe UI', system-ui, sans-serif">
<title id="t">Schemat: jak działa asystent dokumentów firmowych</title>
<desc id="d">Wgrywasz dokumenty firmy i przypisujesz im grupy dostępu, dokumenty są dzielone na fragmenty, pracownik pyta w Telegramie, baza danych odfiltrowuje fragmenty spoza jego uprawnień, model AI odpowiada wyłącznie z dozwolonych fragmentów i podaje źródło, a gdy odpowiedzi nie ma, bot mówi nie znalazłem.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker>
</defs>
<rect width="960" height="580" rx="18" fill="#0c1221"/>
<text x="40" y="52" font-size="26" font-weight="900" fill="#f1f5f9">Jak działa asystent dokumentów firmowych</text>
<text x="40" y="78" font-size="15" fill="#94a3b8">Pracownik pyta w Telegramie, bot odpowiada tylko z dokumentów, do których ma on dostęp.</text>
<rect x="40" y="105" width="250" height="118" rx="14" fill="#131c2f" stroke="#8b5cf6" stroke-opacity=".5"/>
<text x="60" y="136" font-size="17" font-weight="800" fill="#f1f5f9">1. Dokumenty firmy</text>
<text x="60" y="162" font-size="15" fill="#cbd5e1">regulamin, BHP, procedury</text>
<text x="60" y="184" font-size="15" fill="#cbd5e1">FAQ, jako tekst</text>
<text x="60" y="206" font-size="14" fill="#94a3b8">przypisujesz grupy dostępu</text>
<rect x="355" y="105" width="250" height="118" rx="14" fill="#131c2f" stroke="#8b5cf6" stroke-opacity=".5"/>
<text x="375" y="136" font-size="17" font-weight="800" fill="#f1f5f9">2. Przygotowanie</text>
<text x="375" y="162" font-size="15" fill="#cbd5e1">dzielimy na krótkie fragmenty</text>
<text x="375" y="184" font-size="15" fill="#cbd5e1">i zamieniamy na wektory</text>
<text x="375" y="206" font-size="14" fill="#94a3b8">bot szuka po sensie pytania</text>
<rect x="670" y="105" width="250" height="118" rx="14" fill="#131c2f" stroke="#8b5cf6" stroke-opacity=".5"/>
<text x="690" y="136" font-size="17" font-weight="800" fill="#f1f5f9">3. Pracownik pyta</text>
<text x="690" y="162" font-size="15" fill="#cbd5e1">w Telegramie, zwykłym językiem</text>
<text x="690" y="184" font-size="15" fill="#cbd5e1">dołącza kodem /start KOD</text>
<text x="690" y="206" font-size="14" fill="#94a3b8">(kod ważny 7 dni)</text>
<rect x="670" y="275" width="250" height="118" rx="14" fill="#131c2f" stroke="#10b981" stroke-opacity=".7"/>
<text x="690" y="306" font-size="17" font-weight="800" fill="#f1f5f9">4. Sprawdzenie praw</text>
<text x="690" y="332" font-size="15" fill="#cbd5e1">baza filtruje fragmenty</text>
<text x="690" y="354" font-size="15" fill="#cbd5e1">do grup pracownika, zanim</text>
<text x="690" y="376" font-size="14" fill="#94a3b8">zobaczy je model AI</text>
<rect x="355" y="275" width="250" height="118" rx="14" fill="#131c2f" stroke="#10b981" stroke-opacity=".7"/>
<text x="375" y="306" font-size="17" font-weight="800" fill="#f1f5f9">5. Odpowiedź ze źródłem</text>
<text x="375" y="332" font-size="15" fill="#cbd5e1">krótko, tylko z dozwolonych</text>
<text x="375" y="354" font-size="15" fill="#cbd5e1">fragmentów, pod spodem</text>
<text x="375" y="376" font-size="14" fill="#94a3b8">tytuły dokumentów</text>
<rect x="40" y="275" width="250" height="118" rx="14" fill="#131c2f" stroke="#64748b" stroke-opacity=".7"/>
<text x="60" y="306" font-size="17" font-weight="800" fill="#f1f5f9">6. Nie ma odpowiedzi?</text>
<text x="60" y="332" font-size="15" fill="#cbd5e1">bot pisze „nie znalazłem”</text>
<text x="60" y="354" font-size="15" fill="#cbd5e1">zamiast zgadywać, a pytanie</text>
<text x="60" y="376" font-size="14" fill="#94a3b8">trafia na listę luk</text>
<line x1="292" y1="164" x2="351" y2="164" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="607" y1="164" x2="666" y2="164" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="795" y1="225" x2="795" y2="271" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="666" y1="334" x2="609" y2="334" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="351" y1="334" x2="294" y2="334" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="40" y="430" width="880" height="120" rx="14" fill="#131c2f" stroke="#64748b" stroke-opacity=".7"/>
<text x="60" y="462" font-size="17" font-weight="800" fill="#f1f5f9">Czego asystent nie robi (pilotaż)</text>
<text x="60" y="490" font-size="14.5" fill="#cbd5e1">Nie zastępuje decyzji przełożonego ani interpretacji prawnej; przy sprawach ważnych sprawdź podane źródło.</text>
<text x="60" y="512" font-size="14.5" fill="#cbd5e1">Pytanie i dobrane fragmenty przetwarza dostawca modelu AI (OpenAI), więc nie wgrywamy danych wrażliwych bez potrzeby.</text>
<text x="60" y="534" font-size="14.5" fill="#cbd5e1">Na razie przyjmuje dokumenty jako tekst (PDF i Word konwertujemy) i działa w Telegramie.</text>
</svg>
